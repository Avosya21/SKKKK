# LightRAG — граф знаний по документации PrimaryAnalitics (кнопки, API, пайплайны).
# Запуск: cd tools/lightrag && docker compose up -d
# UI/API: http://127.0.0.1:9621  (WebUI + /docs Swagger)

services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: primaryanalitics-lightrag
    ports:
      - "127.0.0.1:9621:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/prompts:/app/data/prompts
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      PROMPT_DIR: /app/data/prompts
      HOST: "0.0.0.0"
      PORT: "9621"
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
