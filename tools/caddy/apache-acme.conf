# PrimaryAnalitics — только ACME HTTP-01. Остальной сайт Apache не трогает.
# Подключается из C:\Apache\Apache24\conf\httpd.conf одной строкой Include.

ProxyRequests Off
ProxyPreserveHost On
ProxyPass        /.well-known/acme-challenge/ http://127.0.0.1:8088/.well-known/acme-challenge/
ProxyPassReverse /.well-known/acme-challenge/ http://127.0.0.1:8088/.well-known/acme-challenge/
