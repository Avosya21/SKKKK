# Инвентарь стенда SKKKK: что реально лежит в проекте и зачем.
#
# Зачем: карта проекта описывает код и данные, но не то, что стоит на машине —
# окружения, портативные инструменты, модели, кэши, конфиги агентов. Этот список
# закрывает пробел и **проверяется автоматически**:
#     venv\Scripts\python.exe scripts\check_stand_inventory.py          # что появилось/пропало
#     venv\Scripts\python.exe scripts\check_stand_inventory.py --docs   # переписать §17 карты
#     venv\Scripts\python.exe -m pytest app/app/tests/test_stand_inventory.py
#
# Правила: `optional: true` — тяжёлое или машинно-зависимое (модели, venv, бинарники,
# кэши): может отсутствовать на другой машине, это не расхождение карты.
# Файлы `*.py` здесь не перечисляются: код проверяет scripts/check_map_drift.py.
# Пометку «в git / не в git» скрипт ставит сам по git status.

version: 1
updated: "2026-10-05"

roots: [".", "docs", "tools", "venvs", "data", "asr", "scripts", "app/app/static/vendor"]

# Прямые потомки этих каталогов не проверяются: временный мусор и каталоги IDE
skip_dirs: ["__pycache__", ".git", ".idea", ".pytest_cache", "tmp"]
# `*.py` и `*.ps1` — код: его полноту проверяет scripts/check_map_drift.py, здесь не дублируется
skip_suffix: [".pyc", ".py", ".ps1", ".db-shm", ".db-wal", ".db-journal", ".lock", ".log"]

# Каталоги документов: каждый файл должен быть упомянут хотя бы в одном документе карты
# (PROJECT-MAP, PLAN, DECISIONS, TESTING, OPERATIONS, stages/README) — иначе он «сирота».
doc_dirs: ["docs/prompts", "docs/plans", "docs/stages", "docs/eval", "docs/agent-exchange"]
doc_sources: ["docs/PROJECT-MAP.md", "docs/PLAN.md", "docs/DECISIONS.md", "docs/TESTING.md",
              "docs/OPERATIONS.md", "docs/stages/README.md"]

# Каталоги кода, полноту которых уже проверяет scripts/check_map_drift.py (реестр модулей и манифест):
# их внутренние файлы в инвентаре не перечисляются.
code_roots: ["app/app", "asr", "scripts"]

