# SKKKK project map manifest — nodes & dependency edges for agents and vector index.
# Update together with docs/PROJECT-MAP.md when adding modules or pipelines.
version: 1
updated: "2026-09-21"

nodes:
  - id: fastapi_main
    kind: process
    path: "app/app/main.py"
    title: "Entry — preflight, edge (Caddy/LiveKit/voice_cleaner), portal :1777, optional GPU worker"
    tags: [runtime, api]

  - id: svc_preflight
    kind: service
    path: "app/app/preflight.py"
    title: "Checks before serve; meeting_voice in all/api plan, not worker"
    tags: [runtime]

  - id: svc_edge_runtime
    kind: service
    path: "app/app/services/edge_runtime.py"
    title: "main all/api starts TLS check then Caddy then LiveKit then voice_cleaner; LiveKit fail keeps portal"
    tags: [runtime, meetings, https]

  - id: svc_tls_cert
    kind: service
    path: "app/app/services/tls_cert.py"
    title: "On main start, inspect :777 cert file and reissue via Caddy :8443 if missing/expired/staging"
    tags: [https, caddy, acme]

  - id: svc_livekit
    kind: process
    path: "tools/livekit/livekit-server.exe"
    title: "Native LiveKit :7880; ICE public node_ip+LAN+127.0.0.1; TURN SKKKK_PUBLIC_HOST; not Docker"
    tags: [runtime, meetings, livekit]

  - id: svc_livekit_env
    kind: service
    path: "app/app/services/livekit_env.py"
    title: "livekit.yaml + keys; LAN includes + public node_ip"
    tags: [meetings, livekit]

  - id: gpu_worker
    kind: process
    path: "app/app/workers/gpu_worker.py"
    title: "Jobs queue worker (one GPU job at a time)"
    tags: [runtime, worker]

  - id: router_pages
    kind: router
    path: "app/app/routers/pages.py"
    title: "HTML pages, artifact reports, GET /meeting.webmanifest, meeting_voice_flags"
    tags: [api, ui]

  - id: router_acme
    kind: router
    path: "app/app/routers/acme.py"
    title: "Public ACME HTTP-01 proxy to Caddy — Let's Encrypt on portal :80"
    tags: [api, https, acme]

  - id: router_auth
    kind: router
    path: "app/app/routers/auth.py"
    title: "Login by allowlist; role from password each time; Telegram ID stored; JWT 30 days"
    tags: [api, auth]

  - id: svc_user_identity
    kind: service
    path: "app/app/services/user_identity.py"
    title: "Resolve user by login name; merge duplicate names; store Telegram ID"
    tags: [auth, db]

  - id: svc_login_allowlist
    kind: service
    path: "app/app/services/login_allowlist.py"
    title: "Read Login_up.txt each login; case-insensitive allowlist"
    tags: [auth]

  - id: file_login_allowlist
    kind: file
    path: "Login_up.txt"
    title: "Allowed login names or emails, one per line"
    tags: [auth]

  - id: router_projects
    kind: router
    path: "app/app/routers/projects.py"
    title: "List/create projects; non-admin sees created/upload/chat/members; DELETE fully purges"
    tags: [api, projects]

  - id: svc_project_access
    kind: service
    path: "app/app/services/project_access.py"
    title: "Own-project guard + project_members; 404 foreign; project_role; lab admin; staff match/rebuild"
    tags: [service, auth, projects]

  - id: svc_project_purge
    kind: service
    path: "app/app/services/project_purge.py"
    title: "Purge project tree or a single artifact files and SQLite rows"
    tags: [service, projects]

  - id: ui_btn_delete_project
    kind: ui_action
    path: "app/app/templates/index.html"
    title: "Удалить проект — в раскрытом описании справа, DELETE /projects/{id}"
    tags: [ui, projects]

  - id: router_upload
    kind: router
    path: "app/app/routers/upload.py"
    title: "Resumable upload, artifact list with speaker button flags, DELETE one artifact"
    tags: [api, upload]

  - id: ui_btn_delete_artifact
    kind: ui_action
    path: "app/app/templates/project.html"
    title: "Удалить артефакт — иконка корзины после Ошибка, DELETE /projects/{id}/artifacts/{art_id}"
    tags: [ui, artifacts]

  - id: router_knowledge
    kind: router
    path: "app/app/routers/knowledge.py"
    title: "Search, graph, TZ, chat, deadlines, entity reextract"
    tags: [api, knowledge]

  - id: router_speakers
    kind: router
    path: "app/app/routers/speaker_profiles.py"
    title: "Speaker enroll/merge, lab enroll/merge, recalculate/summary/reindex API"
    tags: [api, speakers]

  - id: svc_llm
    kind: service
    path: "app/app/services/llm.py"
    title: "Unified LLM adapter (lmstudio | cursor)"
    tags: [llm]

  - id: svc_pipeline_lab
    kind: service
    path: "app/app/services/pipeline_lab.py"
    title: "Lab ASR orchestrator — dual hearing; resume run only if WAV hash matches"
