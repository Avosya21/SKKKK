  - id: svc_chat
    kind: service
    path: app/app/services/chat.py
    title: RAG chat over chunks + entity_vectors + TZ excerpt; memory from chat_messages tape
    tags: [knowledge, llm]

  - id: svc_user_activity
    kind: service
    path: app/app/services/user_activity.py
