  - id: svc_caddy_https
    kind: service
    path: "tools/caddy/Caddyfile"
    title: "Caddy reverse proxy — HTTPS on :777, Let's Encrypt IP cert (shortlived, HTTP-01 on :8088), portal on loopback :1777"
    tags: [https, caddy, acme, deploy]

  - id: svc_ollama_runtime
    kind: service
    path: "app/app/services/ollama_runtime.py"
    title: "Auto-start Ollama before embeddings and indexing"
