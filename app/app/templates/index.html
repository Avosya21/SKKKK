{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
  <h1 class="h3 mb-0">Проекты</h1>
  <button class="btn btn-success" id="btn-new-project">Новый проект</button>
</div>
<div id="projects-list" class="list-group"></div>
<div class="modal fade" id="newProjectModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="new-project-form">
      <div class="modal-header"><h5 class="modal-title">Новый проект</h5></div>
      <div class="modal-body">
        <input class="form-control mb-2" name="name" placeholder="Название" required>
        <textarea class="form-control" name="description" placeholder="Описание"></textarea>
        <div class="alert alert-danger d-none mt-2" id="project-error"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="project-cancel">Отмена</button>
        <button type="submit" class="btn btn-primary skkkk-action-btn" id="project-submit" data-idle-label="Создать">Создать</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if (!SKKKK.requireAuth()) throw new Error('auth');
const modal = new bootstrap.Modal(document.getElementById('newProjectModal'));
async function loadProjects() {
  const r = await SKKKK.api('/projects');
  if (!r.ok) return;
  const list = document.getElementById('projects-list');
  list.innerHTML = '';
  const rows = await r.json();
  if (!Array.isArray(rows) || !rows.length) {
    list.innerHTML = '<p class="text-muted">Пока нет проектов — создайте первый.</p>';
    return;
  }
  for (const p of rows) {
    const item = document.createElement('div');
    item.className = 'list-group-item project-list-item';

    const desc = (p.description || '').trim();
    const title = document.createElement('a');
    title.className = 'project-list-title text-decoration-none fw-semibold';
    title.href = `/projects/${p.id}`;
    title.textContent = p.name;

    if (desc) {
      const collapseId = `project-desc-${p.id}`;
      const header = document.createElement('div');
      header.className = 'project-list-header';

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'project-desc-chevron';
      toggle.setAttribute('data-bs-toggle', 'collapse');
      toggle.setAttribute('data-bs-target', `#${collapseId}`);
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-controls', collapseId);
      toggle.setAttribute('aria-label', 'Показать описание');
      toggle.innerHTML =
        '<svg class="project-desc-chevron-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">' +
        '<path fill="currentColor" d="M4.646 5.646a.5.5 0 0 1 .708 0L8 8.293l2.646-2.647a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 0 1 0-.708z"/>' +
        '</svg>';

      header.appendChild(title);
      header.appendChild(toggle);
      item.appendChild(header);

      const panel = document.createElement('div');
      panel.id = collapseId;
      panel.className = 'collapse mt-2';
      const descText = document.createElement('p');
      descText.className = 'text-muted small mb-0 project-desc-text';
      descText.textContent = desc;
      panel.appendChild(descText);

      panel.addEventListener('show.bs.collapse', () => {
        toggle.setAttribute('aria-expanded', 'true');
        toggle.setAttribute('aria-label', 'Скрыть описание');
      });
      panel.addEventListener('hide.bs.collapse', () => {
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Показать описание');
      });

      item.appendChild(panel);
    } else {
      item.appendChild(title);
    }

    list.appendChild(item);
  }
}
document.getElementById('btn-new-project').onclick = () => modal.show();
document.getElementById('new-project-form').onsubmit = async (e) => {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const err = document.getElementById('project-error');
  err.classList.add('d-none');

  await SKKKK.guardSubmit(form, async () => {
    const r = await SKKKK.api('/projects', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.fromEntries(fd.entries())),
    });
    if (!r.ok) {
      err.textContent = r.status === 403 ? 'Недостаточно прав' : 'Ошибка создания';
      err.classList.remove('d-none');
      return;
    }
    modal.hide();
    form.reset();
    await loadProjects();
  }, { busyText: 'Создаю…' });
};
loadProjects();
</script>
{% endblock %}
