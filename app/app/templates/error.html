{% extends "base.html" %}
{# Страница ошибки HTML (403/404/500) с понятным текстом на русском #}
{% block content %}
<div class="text-center py-5" role="alert">
  <div class="display-6 fw-semibold mb-2">{{ code }}</div>
  <h1 class="h4 mb-3">{{ heading }}</h1>
  <p class="text-muted mb-4">{{ message }}</p>
  <a class="btn btn-primary" href="/">К проектам</a>
</div>
{% endblock %}
