<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title }} — Primary Analytics</title>
  <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-3 mb-md-4 navbar-skkkk">
  <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2 py-1">
    <div class="d-flex align-items-center gap-0 min-w-0 me-auto navbar-brand-row">
      <a class="navbar-brand mb-0 py-1 flex-shrink-0" href="/">Primary Analytics</a>
      {% block nav_project %}{% endblock %}
    </div>
    <div class="d-flex align-items-center gap-2 flex-shrink-0 ms-auto">
      {% block nav_actions %}{% endblock %}
      <span class="badge rounded-pill text-bg-secondary d-none" id="nav-llm" title="LLM-провайдер"></span>
      <span class="navbar-text text-white-50 mb-0" id="nav-user"></span>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
<script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
