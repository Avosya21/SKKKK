{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">Очередь конфликтов</h1>
<div id="list" class="vstack gap-2"></div>
<script>
(async () => {
  if (!SKKKK.requireAuth()) return;
  const projects = await (await SKKKK.api('/projects')).json();
  const root = document.getElementById('list');
  for (const p of projects) {
    const r = await SKKKK.api(`/projects/${p.id}/conflicts`);
    if (r.status === 403) continue;
    const rows = await r.json();
    for (const c of rows) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="card-body"><pre class="mb-0 small text-break">${JSON.stringify(c, null, 2)}</pre></div>`;
      root.appendChild(card);
    }
  }
  if (!root.children.length) {
    root.innerHTML = '<p class="text-muted">Конфликтов нет.</p>';
  }
})();
</script>
{% endblock %}
