# Конфиг projectmap для этого проекта.
# graph — граф, по которому считается охват (строит scripts/export_project_graph.py, позже — сам projectmap).
# ignore — осознанные исключения: то, что карте не нужно. Каждое исключение с причиной; всё остальное, чего нет в графе, — пробел.
# targets — цели охвата по пробам (доля 0..1); ниже цели проба показывается как пробел, с --strict даёт код выхода 1.
graph: .projectmap/out/graph.json

ignore:
  # сторонние навыки ИИ-агента (копия чужих наборов, не код проекта)
  - ".cursor/skills/**"
  # бинарные данные и носители: картинки, звук, архивы, словари OCR, таблицы данных
  - "**/*.png"
  - "**/*.webp"
  - "**/*.wav"
  - "**/*.jar"
  - "**/*.traineddata"
  - "**/*.train"
  - "**/*.csv"
  - "**/*.out"
  # портативный OCR (бинарники и языковые данные)
  - "tools/tesseract/**"
  # эксперименты и архив: не рабочий код
  - "experiments/**"
  - "_archive/**"
  # данные тестов и замеров, кэши моделей
  - "app/app/tests/fixtures/**"
  - "docs/eval/**"
  - "asr/whisper-cache/**"
  # списки версий пакетов: данные, не код
  - "scripts/requirements_lock/**"

# Переменные окружения, которых не должно быть в образце: тестовые стенды и внутренние, которые конвейер сам подставляет подпроцессам.
ignore_env:
  - "SMOKE_*"
  - "SKKKK_ARTIFACT_ID"
  - "SKKKK_PROJECT_ID"
  - "SKKKK_AUDIO_URL"
  - "SKKKK_MATCH_JSON"
  - "APP_DIR"
  - "OUT_DIR"
  - "ASR_ENGINE"
  - "PYCHARM_HOSTED"

# Цели охвата по пробам (доля 0..1). Задаются на достигнутом уровне с небольшим запасом и повышаются, когда пробел закрыт:
#  ui_api — формы отправляются событием `submit` формы, а не кнопки; env — часть переменных читается кодом, но не описана в .env.example;
#  tests — часть модулей проверяется только живыми прогонами (qa_*), а не тестами; history — коммиты, затронувшие только исключённые файлы.
targets:
  files: 0.97
  shell_functions: 0.9
  compose_services: 0.9
  script_refs: 0.7
  doc_refs_valid: 0.97
  doc_refs_in_graph: 0.9
  ui_api: 0.85
  data_access: 1.0
  env: 0.75
  tests: 0.65
  history: 0.9
  metrics: 0.95

metrics:
  resolution: 1.5      # крупнее — больше мелких групп
  seeds: 5             # сколько раз запускать Louvain (берётся лучший, результат воспроизводим)
  hub_min: 10          # «хаб»: и fan-in, и fan-out не меньше
