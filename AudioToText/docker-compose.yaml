version: "3.8"

services:
  gigaam-transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gigaam-transcriber

    # монтируем проект внутрь контейнера
    volumes:
      - ./:/app
      - data_cache:/root/.cache
    environment:
      - HF_TOKEN=${HF_TOKEN:-}

    # что передать python-скрипту при старте контейнера
    command: ["data/встреча с борга 07.07.26.mp4"]

    # работа в WSL → лучше оставить host
    network_mode: "host"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]

volumes:
    data_cache:
