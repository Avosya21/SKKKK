version: "3.8"

services:
  gigaam-transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gigaam-transcriber
    volumes:
      - ./:/app
    environment:
      - HF_TOKEN=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
    command: ["data/2025-12-10 12-00-25.mkv"]
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]     # использовать GPU с индексом 0
              capabilities: ["gpu"]
